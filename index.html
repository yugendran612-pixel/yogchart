<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yogchart - Live Trading Terminal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&display=swap');
        .terminal-font { font-family: 'Fira Code', monospace; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #374151; border-radius: 3px; }
        .draw-active { background-color: #3b82f6 !important; color: white; }
    </style>
</head>
<body class="bg-gray-50 dark:bg-gray-950 text-gray-900 dark:text-gray-100 h-screen flex flex-col transition-colors duration-200">
    
    <!-- Navbar -->
    <header class="flex justify-between items-center px-4 py-3 border-b border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-900 z-10">
        <div class="flex items-center gap-4">
            <h1 class="text-xl font-bold tracking-tighter">YOGCHART<span class="text-blue-500">.</span></h1>
            <div class="flex items-center bg-gray-100 dark:bg-gray-800 border border-gray-300 dark:border-gray-700 rounded px-2">
                <span class="text-gray-500 text-sm">🔎</span>
                <input id="symbolInput" type="text" value="XRPUSDT" class="bg-transparent border-none focus:outline-none px-2 py-1 text-sm font-bold uppercase w-28" placeholder="TICKER...">
                <button id="loadSymbolBtn" class="text-xs bg-gray-300 dark:bg-gray-700 px-2 py-1 rounded hover:bg-gray-400 dark:hover:bg-gray-600 font-bold">LOAD</button>
            </div>
            <span id="livePrice" class="font-bold text-lg terminal-font tracking-tight">--</span>
        </div>
        <div class="flex gap-3">
            <button id="themeToggle" class="px-3 py-1.5 text-sm bg-gray-200 dark:bg-gray-800 rounded hover:opacity-80">🌓 Theme</button>
        </div>
    </header>

    <!-- Main Workspace -->
    <main class="flex-1 flex overflow-hidden">
        
        <!-- Toolbar (Left) -->
        <aside class="w-12 border-r border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-900 flex flex-col items-center py-4 gap-4 z-10">
            <button id="drawTrendlineBtn" class="p-2 hover:bg-gray-200 dark:hover:bg-gray-800 rounded text-xl transition-colors" title="Draw Trendline">📈</button>
            <button id="clearDrawingsBtn" class="p-2 hover:bg-gray-200 dark:hover:bg-gray-800 rounded text-xl transition-colors" title="Clear Drawings">🗑️</button>
        </aside>

        <!-- Chart Area (Center) -->
        <section class="flex-1 relative flex flex-col cursor-crosshair">
            <div id="chartContainer" class="flex-1 w-full h-full"></div>
        </section>

        <!-- Sidebar: Order Flow & AI (Right) -->
        <aside class="w-72 border-l border-gray-200 dark:border-gray-800 flex flex-col bg-white dark:bg-gray-900 terminal-font text-xs z-10">
            
            <!-- AI Recommender -->
            <div class="p-3 border-b border-gray-200 dark:border-gray-800">
                <button id="runAi" class="w-full bg-blue-600 text-white font-bold py-2 rounded hover:bg-blue-700 transition">AI FORECAST</button>
                <div id="aiOutput" class="mt-2 hidden text-gray-600 dark:text-gray-400">
                    <p class="text-green-500 font-bold">> SIGNAL: BULLISH BREAKOUT</p>
                    <p>> Volatility: Increasing</p>
                    <p>> AI Target: +3.5%</p>
                </div>
            </div>

            <!-- Live Order Flow (Tape) -->
            <div class="flex-1 overflow-hidden flex flex-col p-3">
                <div class="flex justify-between text-gray-500 mb-2 border-b border-gray-200 dark:border-gray-800 pb-1">
                    <span>PRICE</span>
                    <span>AMOUNT</span>
                    <span>TIME</span>
                </div>
                <div id="orderTape" class="flex-1 overflow-y-auto space-y-1 pr-1 font-semibold">
                    <!-- Live trades injected here -->
                </div>
            </div>
        </aside>
    </main>

    <script>
        // --- 1. Global Setup & Theme ---
        const html = document.documentElement;
        document.getElementById('themeToggle').addEventListener('click', () => {
            html.classList.toggle('dark');
            updateChartTheme();
        });

        // --- 2. Initialize Chart ---
        const chartContainer = document.getElementById('chartContainer');
        const chart = LightweightCharts.createChart(chartContainer, {
            autoSize: true,
            layout: { background: { type: 'solid', color: '#030712' }, textColor: '#9ca3af' },
            grid: { vertLines: { color: '#1f2937', style: 1 }, horzLines: { color: '#1f2937', style: 1 } },
            crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
            timeScale: { timeVisible: true, secondsVisible: false },
        });

        const candleSeries = chart.addCandlestickSeries({
            upColor: '#22c55e', downColor: '#ef4444', borderVisible: false,
            wickUpColor: '#22c55e', wickDownColor: '#ef4444'
        });

        function updateChartTheme() {
            const isDark = html.classList.contains('dark');
            chart.applyOptions({
                layout: { background: { color: isDark ? '#030712' : '#ffffff' }, textColor: isDark ? '#9ca3af' : '#374151' },
                grid: { vertLines: { color: isDark ? '#1f2937' : '#e5e7eb' }, horzLines: { color: isDark ? '#1f2937' : '#e5e7eb' } }
            });
        }

        // --- 3. Drawing Tools (Trendlines) ---
        let isDrawingMode = false;
        let activeLineSeries = null;
        let linePoints = [];
        let allLines = [];

        document.getElementById('drawTrendlineBtn').addEventListener('click', (e) => {
            isDrawingMode = !isDrawingMode;
            e.currentTarget.classList.toggle('draw-active');
        });

        document.getElementById('clearDrawingsBtn').addEventListener('click', () => {
            allLines.forEach(line => chart.removeSeries(line));
            allLines = [];
            linePoints = [];
        });

        chartContainer.addEventListener('click', (event) => {
            if (!isDrawingMode) return;
            
            const param = chart.timeScale().coordinateToLogical(event.clientX - chartContainer.getBoundingClientRect().left);
            const price = candleSeries.coordinateToPrice(event.clientY - chartContainer.getBoundingClientRect().top);
            
            if (param === null || price === null) return;
            
            // Get exact time from logical index
            const dataPoint = candleSeries.dataByIndex(param);
            if (!dataPoint) return;

            linePoints.push({ time: dataPoint.time, value: price });

            if (linePoints.length === 1) {
                // Start new line
                activeLineSeries = chart.addLineSeries({ color: '#3b82f6', lineWidth: 2 });
                activeLineSeries.setData([linePoints[0]]);
                allLines.push(activeLineSeries);
            } else if (linePoints.length === 2) {
                // Finish line
                activeLineSeries.setData([{ time: linePoints[0].time, value: linePoints[0].value }, { time: linePoints[1].time, value: linePoints[1].value }]);
                linePoints = []; // Reset for next line
                isDrawingMode = false;
                document.getElementById('drawTrendlineBtn').classList.remove('draw-active');
            }
        });


        // --- 4. Live Data & Order Tape (MEXC WebSockets) ---
        let currentSymbol = 'XRPUSDT';
        let wsKline = null;
        let wsDeals = null;
        const livePriceEl = document.getElementById('livePrice');
        const orderTape = document.getElementById('orderTape');

        async function initSymbol(symbol) {
            currentSymbol = symbol.toUpperCase();
            document.getElementById('symbolInput').value = currentSymbol;
            orderTape.innerHTML = ''; // Clear tape

            try {
                // 1. Fetch Historical Candles
                const res = await fetch(`https://api.mexc.com/api/v3/klines?symbol=${currentSymbol}&interval=1m&limit=200`);
                const data = await res.json();
                const formattedData = data.map(d => ({
                    time: Math.floor(d[0] / 1000), open: parseFloat(d[1]), high: parseFloat(d[2]), low: parseFloat(d[3]), close: parseFloat(d[4])
                }));
                candleSeries.setData(formattedData);

                // 2. Live Kline WebSocket
                if(wsKline) wsKline.close();
                wsKline = new WebSocket('wss://wbs.mexc.com/ws');
                wsKline.onopen = () => wsKline.send(JSON.stringify({ "method": "SUBSCRIPTION", "params": [`spot@public.kline.v3.api@${currentSymbol}@Min1`] }));
                wsKline.onmessage = (event) => {
                    const msg = JSON.parse(event.data);
                    if (msg.d && msg.d.k) {
                        const k = msg.d.k;
                        const currentPrice = parseFloat(k.c);
                        candleSeries.update({ time: k.t, open: parseFloat(k.o), high: parseFloat(k.h), low: parseFloat(k.l), close: currentPrice });
                        
                        // Update Top Price Tracker
                        livePriceEl.innerText = `$${currentPrice.toFixed(4)}`;
                        livePriceEl.className = currentPrice >= parseFloat(k.o) ? 'font-bold text-lg terminal-font tracking-tight text-green-500' : 'font-bold text-lg terminal-font tracking-tight text-red-500';
                    }
                };

                // 3. Live Order Tape (Deals) WebSocket
                if(wsDeals) wsDeals.close();
                wsDeals = new WebSocket('wss://wbs.mexc.com/ws');
                wsDeals.onopen = () => wsDeals.send(JSON.stringify({ "method": "SUBSCRIPTION", "params": [`spot@public.deals.v3.api@${currentSymbol}`] }));
                wsDeals.onmessage = (event) => {
                    const msg = JSON.parse(event.data);
                    if (msg.d && msg.d.deals) {
                        msg.d.deals.forEach(deal => {
                            const isBuy = deal.S === 1; // 1 is Buy, 2 is Sell
                            const price = parseFloat(deal.p).toFixed(4);
                            const amount = parseFloat(deal.v).toFixed(2);
                            const timeStr = new Date(deal.t).toLocaleTimeString([], { hour12: false });

                            const div = document.createElement('div');
                            div.className = `flex justify-between ${isBuy ? 'text-green-500' : 'text-red-500'} hover:bg-gray-100 dark:hover:bg-gray-800 px-1 rounded`;
                            div.innerHTML = `<span>${price}</span><span>${amount}</span><span class="text-gray-500 text-[10px]">${timeStr}</span>`;
                            
                            orderTape.prepend(div);
                            if (orderTape.children.length > 30) orderTape.lastChild.remove();
                        });
                    }
                };
            } catch (err) {
                alert("Symbol not found or API error. Try 'BTCUSDT' or 'XRPUSDT'.");
            }
        }

        // Search Input Listener
        document.getElementById('loadSymbolBtn').addEventListener('click', () => initSymbol(document.getElementById('symbolInput').value));
        document.getElementById('symbolInput').addEventListener('keypress', (e) => { if(e.key === 'Enter') initSymbol(e.target.value); });
        
        initSymbol('XRPUSDT'); // Default Start

        // --- 5. AI Recommender Interaction ---
        document.getElementById('runAi').addEventListener('click', (e) => {
            const btn = e.target;
            btn.innerText = "CALCULATING...";
            setTimeout(() => {
                btn.innerText = "AI FORECAST";
                document.getElementById('aiOutput').classList.remove('hidden');
            }, 800);
        });
    </script>
</body>
</html>
