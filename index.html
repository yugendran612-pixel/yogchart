<script>
        // ==========================================
        // 1. SUPABASE AUTHENTICATION
        // ==========================================
        const supabaseUrl = 'https://gqdirctfbzlnnfctcdcy.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdxZGlyY3RmYnpsbm5mY3RjZGN5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI4MzIxMjMsImV4cCI6MjEwODQwODEyM30.D12kInUr6jHHxCNTWLuoNGXUrxFPWFYdKHxw0cAfaWA';
        
        // RENAMED to supabaseClient to fix the syntax error
        const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

        const loginBtn = document.getElementById('loginBtn'); 
        if (loginBtn) {
            loginBtn.addEventListener('click', async () => {
                const { data, error } = await supabaseClient.auth.signInWithOAuth({
                    provider: 'google',
                    options: { redirectTo: window.location.origin + '/index.html' }
                });
                if (error) alert("Login failed: " + error.message);
            });
        }

        async function checkUser() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session && loginBtn) {
                loginBtn.innerText = 'LOGGED IN';
                loginBtn.classList.remove('bg-blue-600', 'hover:bg-blue-700');
                loginBtn.classList.add('bg-green-600', 'hover:bg-green-700');
            }
        }
        checkUser();

        // ==========================================
        // 2. THEME & HOTKEYS
        // ==========================================
        const html = document.documentElement;
        document.getElementById('themeToggle').addEventListener('click', () => {
            html.classList.toggle('dark');
            const isDark = html.classList.contains('dark');
            chart.applyOptions({
                layout: { background: { color: isDark ? '#030712' : '#ffffff' }, textColor: isDark ? '#9ca3af' : '#374151' },
                grid: { vertLines: { color: isDark ? '#1f2937' : '#e5e7eb' }, horzLines: { color: isDark ? '#1f2937' : '#e5e7eb' } }
            });
        });

        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
            if (e.shiftKey && e.key.toLowerCase() === 'b') { e.preventDefault(); alert('MARKET BUY EXECUTED'); }
            if (e.shiftKey && e.key.toLowerCase() === 's') { e.preventDefault(); alert('MARKET SELL EXECUTED'); }
        });

        // ==========================================
        // 3. CHARTING & LIVE DATA ENGINE
        // ==========================================
        const chartContainer = document.getElementById('chartContainer');
        const chart = LightweightCharts.createChart(chartContainer, {
            layout: { background: { type: 'solid', color: '#030712' }, textColor: '#9ca3af' },
            grid: { vertLines: { color: '#1f2937' }, horzLines: { color: '#1f2937' } },
            crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
            timeScale: { timeVisible: true, secondsVisible: false },
        });

        new ResizeObserver(entries => {
            if (entries.length === 0 || entries[0].target !== chartContainer) return;
            const newRect = entries[0].contentRect;
            chart.applyOptions({ height: newRect.height, width: newRect.width });
        }).observe(chartContainer);

        const candleSeries = chart.addCandlestickSeries({
            upColor: '#22c55e', downColor: '#ef4444', borderVisible: false,
            wickUpColor: '#22c55e', wickDownColor: '#ef4444'
        });

        let wsKline = null;
        let wsTrade = null;
        let wsDepth = null;
        
        const livePriceEl = document.getElementById('livePrice');
        const orderTape = document.getElementById('orderTape');
        const asksEl = document.getElementById('orderBookAsks');
        const bidsEl = document.getElementById('orderBookBids');
        const spreadEl = document.getElementById('orderBookSpread');

        async function initSymbol(symbol) {
            symbol = symbol.toUpperCase();
            document.getElementById('symbolInput').value = symbol;
            orderTape.innerHTML = '';
            asksEl.innerHTML = '';
            bidsEl.innerHTML = '';
            candleSeries.setData([]); 
            livePriceEl.innerText = 'Loading...';

            try {
                const res = await fetch(`https://api.binance.com/api/v3/klines?symbol=${symbol}&interval=1m&limit=200`);
                if (res.ok) {
                    const data = await res.json();
                    const formattedData = data.map(d => ({
                        time: Math.floor(d[0] / 1000), open: parseFloat(d[1]), high: parseFloat(d[2]), low: parseFloat(d[3]), close: parseFloat(d[4])
                    })).sort((a, b) => a.time - b.time);
                    candleSeries.setData(formattedData);
                }
            } catch (err) { console.warn("History fetch blocked. Starting live stream only."); }

            const wsSymbol = symbol.toLowerCase();

            // K-Line WebSocket
            if (wsKline) wsKline.close();
            wsKline = new WebSocket(`wss://stream.binance.com:9443/ws/${wsSymbol}@kline_1m`);
            wsKline.onmessage = (event) => {
                const msg = JSON.parse(event.data);
                const closePrice = parseFloat(msg.k.c);
                candleSeries.update({ time: Math.floor(msg.k.t / 1000), open: parseFloat(msg.k.o), high: parseFloat(msg.k.h), low: parseFloat(msg.k.l), close: closePrice });
                livePriceEl.innerText = closePrice >= 10 ? closePrice.toFixed(2) : closePrice.toFixed(4);
                livePriceEl.className = closePrice >= parseFloat(msg.k.o) ? 'font-bold text-lg terminal-font leading-none text-green-500' : 'font-bold text-lg terminal-font leading-none text-red-500';
            };

            // Trade WebSocket
            if (wsTrade) wsTrade.close();
            wsTrade = new WebSocket(`wss://stream.binance.com:9443/ws/${wsSymbol}@trade`);
            wsTrade.onmessage = (event) => {
                const msg = JSON.parse(event.data);
                const isBuy = !msg.m; 
                const price = parseFloat(msg.p);
                const qty = parseFloat(msg.q);
                
                const formattedPrice = price >= 10 ? price.toFixed(2) : price.toFixed(4);
                const formattedQty = qty > 1000 ? (qty/1000).toFixed(1) + 'K' : qty.toFixed(2);
                const timeStr = new Date(msg.T).toLocaleTimeString([], { hour12: false, hour: '2-digit', minute:'2-digit', second:'2-digit' });

                const div = document.createElement('div');
                div.className = `flex justify-between px-3 py-1 rounded text-[11px] ${isBuy ? 'text-green-500 bg-green-500/5' : 'text-red-500 bg-red-500/5'} hover:bg-gray-200 dark:hover:bg-gray-800 transition-colors`;
                div.innerHTML = `<span class="w-1/3 font-bold">${formattedPrice}</span><span class="w-1/3 text-right">${formattedQty}</span><span class="w-1/3 text-right text-gray-500">${timeStr}</span>`;
                orderTape.prepend(div);
                if (orderTape.children.length > 50) orderTape.lastChild.remove();
            };

            // Depth WebSocket
            if (wsDepth) wsDepth.close();
            wsDepth = new WebSocket(`wss://stream.binance.com:9443/ws/${wsSymbol}@depth10@100ms`);
            wsDepth.onmessage = (event) => {
                const msg = JSON.parse(event.data);
                const formatOrder = (order, type) => {
                    const price = parseFloat(order[0]).toFixed(4);
                    const qty = parseFloat(order[1]);
                    const formattedQty = qty > 1000 ? (qty/1000).toFixed(1) + 'K' : qty.toFixed(2);
                    const width = Math.min((qty / 50000) * 100, 100);
                    const color = type === 'ask' ? 'red' : 'green';
                    
                    return `
                        <div class="flex justify-between px-3 text-[11px] relative">
                            <div class="absolute inset-0 bg-${color}-500 opacity-[0.15]" style="width: ${width}%"></div>
                            ${type === 'ask' 
                                ? `<span class="relative z-10 text-gray-400">${formattedQty}</span><span class="relative z-10 text-${color}-500 font-bold">${price}</span>`
                                : `<span class="relative z-10 text-${color}-500 font-bold">${price}</span><span class="relative z-10 text-gray-400">${formattedQty}</span>`
                            }
                        </div>
                    `;
                };

                if (msg.asks && msg.bids) {
                    asksEl.innerHTML = msg.asks.slice(0, 8).map(ask => formatOrder(ask, 'ask')).join('');
                    bidsEl.innerHTML = msg.bids.slice(0, 8).map(bid => formatOrder(bid, 'bid')).join('');
                    spreadEl.innerText = `SPREAD: $${(parseFloat(msg.asks[0][0]) - parseFloat(msg.bids[0][0])).toFixed(4)}`;
                }
            };
        }

        document.getElementById('symbolInput').addEventListener('keypress', (e) => { if(e.key === 'Enter') initSymbol(e.target.value); });
        initSymbol('XRPUSDT');
    </script>
