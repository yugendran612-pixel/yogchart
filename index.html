<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yogchart - Terminal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lightweight-charts@4.2.1/dist/lightweight-charts.standalone.production.js"></script>
    
    <!-- Supabase SDK for Authentication and Database -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script>tailwind.config = { darkMode: 'class' }</script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&display=swap');
        body { margin: 0; overflow: hidden; font-family: 'Inter', sans-serif; }
        .terminal-font { font-family: 'Fira Code', monospace; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #374151; border-radius: 4px; }
        #chart-wrapper { position: relative; width: 100%; height: 100%; }
        #chartContainer { position: absolute; top: 0; left: 0; right: 0; bottom: 0; }
    </style>
</head>
<body class="bg-gray-50 dark:bg-[#030712] text-gray-900 dark:text-gray-100 h-screen flex">
    
    <!-- Global Navigation Rail -->
    <nav class="w-16 flex flex-col items-center py-4 border-r border-gray-200 dark:border-gray-800 bg-white dark:bg-[#0B0E14] z-30 flex-shrink-0">
        <div class="font-bold text-xl mb-8 tracking-tighter text-blue-500">Y.</div>
        <a href="index.html" class="p-3 mb-2 bg-blue-500/10 text-blue-500 rounded-xl" title="Terminal">📈</a>
        <a href="portfolio.html" class="p-3 mb-2 hover:bg-gray-100 dark:hover:bg-gray-800 rounded-xl text-gray-500 transition" title="Portfolio">💼</a>
        <a href="social.html" class="p-3 mb-2 hover:bg-gray-100 dark:hover:bg-gray-800 rounded-xl text-gray-500 transition" title="Trollbox">💬</a>
        <div class="mt-auto">
            <button id="themeToggle" class="p-3 hover:bg-gray-100 dark:hover:bg-gray-800 rounded-xl text-gray-500">🌓</button>
        </div>
    </nav>

    <!-- Main Content Wrapper -->
    <div class="flex-1 flex flex-col overflow-hidden">
        <!-- Top Header -->
        <header class="h-14 flex justify-between items-center px-4 border-b border-gray-200 dark:border-gray-800 bg-white dark:bg-[#0B0E14] z-20">
            <div class="flex items-center gap-4">
                <div class="flex items-center bg-gray-100 dark:bg-gray-800 border border-gray-300 dark:border-gray-700 rounded px-2">
                    <span class="text-gray-400 text-sm">🔍</span>
                    <input id="symbolInput" type="text" value="XRPUSDT" class="bg-transparent border-none focus:outline-none py-1 px-2 text-sm font-bold uppercase w-24 terminal-font">
                </div>
                <div class="flex flex-col">
                    <span class="text-[10px] text-gray-500 font-bold tracking-widest uppercase">Live Price</span>
                    <span id="livePrice" class="font-bold text-lg terminal-font leading-none text-gray-400">--</span>
                </div>
            </div>
            <div class="flex items-center gap-4">
                <span class="text-xs text-gray-500 font-bold hidden md:block">HOTKEY: <span class="bg-gray-800 px-1.5 py-0.5 rounded text-white">Shift+B</span> Buy</span>
                
                <!-- LOGIN BUTTON WITH ID -->
                <button id="loginBtn" class="bg-blue-600 text-white text-xs font-bold px-4 py-1.5 rounded hover:bg-blue-700 transition">LOGIN</button>
            </div>
        </header>

        <!-- Workspace -->
        <main class="flex-1 flex overflow-hidden">
            <!-- Chart Section -->
            <section class="flex-1 relative" id="chart-wrapper">
                <div id="chartContainer"></div>
            </section>

            <!-- Sidebar: Tape & Order Book -->
            <aside class="w-80 border-l border-gray-200 dark:border-gray-800 flex flex-col bg-white dark:bg-[#0B0E14] terminal-font text-xs z-10 flex-shrink-0">
                
                <!-- AI Module -->
                <div class="p-4 border-b border-gray-200 dark:border-gray-800 bg-gray-50 dark:bg-gray-900/30">
                    <h3 class="font-bold text-gray-500 mb-2">AI ENGINE</h3>
                    <button class="w-full bg-blue-600 text-white py-1.5 rounded font-bold hover:bg-blue-700">ANALYZE TAPE</button>
                </div>
                
                <!-- Live Order Tape -->
                <div class="flex-1 overflow-hidden flex flex-col min-h-0">
                    <div class="flex justify-between text-gray-400 px-4 py-2 border-b border-gray-200 dark:border-gray-800 bg-gray-50 dark:bg-[#0B0E14]">
                        <span class="w-1/3">PRICE</span><span class="w-1/3 text-right">SIZE</span><span class="w-1/3 text-right">TIME</span>
                    </div>
                    <div id="orderTape" class="flex-1 overflow-y-auto p-1"></div>
                </div>

                <!-- Level 2 Order Book -->
                <div class="h-64 flex flex-col border-t border-gray-200 dark:border-gray-800 bg-white dark:bg-[#0B0E14]">
                    <div class="bg-gray-100 dark:bg-gray-900 px-4 py-1.5 border-b border-gray-200 dark:border-gray-800">
                        <h3 class="font-bold text-gray-500 flex items-center gap-2">📊 LEVEL 2 DEPTH</h3>
                    </div>
                    <div class="flex justify-between text-gray-400 px-3 py-1 bg-gray-50 dark:bg-[#0B0E14] text-[10px]">
                        <span>BID SIZE</span><span>PRICE</span><span>ASK SIZE</span>
                    </div>
                    
                    <!-- Asks (Sells - Red) -->
                    <div id="orderBookAsks" class="flex-1 flex flex-col-reverse p-1 space-y-reverse space-y-0.5 overflow-hidden"></div>
                    
                    <!-- Spread Indicator -->
                    <div id="orderBookSpread" class="text-center font-bold py-1 bg-gray-100 dark:bg-gray-800 text-[10px] text-gray-500">SPREAD: --</div>
                    
                    <!-- Bids (Buys - Green) -->
                    <div id="orderBookBids" class="flex-1 flex flex-col p-1 space-y-0.5 overflow-hidden"></div>
                </div>

            </aside>
        </main>
    </div>
    
    <!-- Scripts -->
    <script src="js/global.js"></script>
    <script src="js/chart.js"></script>
</body>
</html>
